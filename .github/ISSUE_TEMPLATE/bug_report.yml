name: Bug Report
description: Report a bug or issue with Sentry MCP Optimized
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the form below.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Initialize SentryMCPOptimized with...
        2. Call method...
        3. See error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: I expected...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: Instead, I got...
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: Code Sample
      description: Please provide a minimal code sample that reproduces the issue
      render: python
      placeholder: |
        from sentry_mcp import SentryMCPOptimized

        sentry = SentryMCPOptimized(...)
        issues = await sentry.list_issues(...)
    validations:
      required: false

  - type: textarea
    id: error
    attributes:
      label: Error Message
      description: If applicable, paste the full error message and stack trace
      render: shell
      placeholder: |
        Traceback (most recent call last):
          ...
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Version
      description: What version of Sentry MCP Optimized are you using?
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python Version
      description: What version of Python are you using?
      placeholder: "3.11.4"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      description: What operating system are you using?
      placeholder: "Ubuntu 22.04"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment Details
      description: Any additional environment details (Docker, framework versions, etc.)
      placeholder: |
        - mcp-optimizer-framework: 1.0.0
        - Docker version: 24.0.5
        - etc.
    validations:
      required: false

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How severe is this bug?
      options:
        - Critical (blocks usage)
        - High (major functionality broken)
        - Medium (workaround available)
        - Low (minor issue)
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched existing issues to avoid duplicates
          required: true
        - label: I have included a minimal reproducible example
          required: false
        - label: I have checked the [Troubleshooting Guide](https://github.com/rhart696/sentry-mcp-optimized/blob/main/docs/TROUBLESHOOTING.md)
          required: false
        - label: I am using the latest version
          required: false
